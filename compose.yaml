services:
  reflex:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REFLEX_DATA_DIR: /app/data
      MODEL_DIR: /app/data/model
      MAX_UPLOAD_BYTES: 12582912
      MAX_IMAGE_EDGE: 4096
      MAX_IMAGE_PIXELS: 20000000
      UPLOADS_PER_WINDOW: 10
      UPLOAD_RATE_WINDOW_SECONDS: 600
    volumes:
      - reflex_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  reflex_data:
